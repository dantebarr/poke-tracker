<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mockup B — Settings</title>
<style>
  @font-face { font-family: "PressStart"; src: url("../assets/press-start-2p.woff2") format("woff2"); font-display: swap; }
  @font-face { font-family: "VT323"; src: url("../assets/vt323.woff2") format("woff2"); font-display: swap; }

  :root {
    --edge:   #0d3a1c;
    --dark:   #1d6a33;
    --mid:    #2f8f47;
    --light:  #58ba6c;
    --pale:   #b8e8c2;
    --sel:    #f2f5c8;
    --shadowtext: 2px 2px 0 rgba(0,0,0,.45);
    --box:    #f8f8f8;
    --boxink: #202020;
    --rsv:    #2f7d4f;
    --rsh:    #146b62;
    --adm:    #8a5a3b;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    height: 100dvh;
    height: 100vh;
    background: #0a2a14;
    background-image:
      radial-gradient(120% 80% at 50% 0%, #17472a, transparent 70%),
      repeating-linear-gradient(45deg, rgba(255,255,255,.02) 0 2px, transparent 2px 6px);
    color: #fff;
    font-family: "VT323", ui-monospace, monospace;
    -webkit-font-smoothing: none;
  }
  img { display: block; image-rendering: pixelated; }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: none; }
  input { font-family: inherit; color: inherit; }

  .panel {
    background: linear-gradient(180deg, var(--mid), var(--dark));
    border: 4px solid var(--edge);
    border-radius: 12px;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.28), 0 6px 0 rgba(0,0,0,.35);
  }
  .pixel { font-family: "PressStart", monospace; letter-spacing: 0; }

  .app {
    height: 100dvh;
    height: 100vh;
    max-width: 1440px; margin: 0 auto;
    padding: 14px;
    padding-bottom: max(14px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 12px;
  }

  /* ── status strip — identical to the field mockup ──────────── */
  .strip {
    display: flex; align-items: center; gap: 14px;
    padding: 11px 16px;
    font-family: "PressStart", monospace; font-size: 10px;
    text-shadow: var(--shadowtext);
  }
  .strip .ball { flex: none; width: 18px; height: 18px; border-radius: 50%;
    background: linear-gradient(180deg, #e8503c 0 45%, #101010 45% 55%, #f4f4f4 55%);
    border: 2px solid #101010; }
  .identity { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .identity .who { display: flex; align-items: center; gap: 14px; }
  .strip nav { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none; }
  .strip nav a.icobtn, .strip nav a.replay { text-decoration: none; }
  .strip nav a.icobtn {
    display: flex; align-items: center; justify-content: center;
    width: 30px; height: 30px;
    background: linear-gradient(180deg, var(--light), var(--mid));
    border: 3px solid var(--edge); border-radius: 7px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.3), 0 3px 0 rgba(0,0,0,.35);
    color: inherit;
  }
  .strip nav a.icobtn:hover { background: linear-gradient(180deg, #74d086, var(--light)); }
  .strip nav a.icobtn.active { background: linear-gradient(180deg, var(--sel), #d8dd96); box-shadow: inset 0 0 0 1px rgba(0,0,0,.2), 0 3px 0 rgba(0,0,0,.35); }
  .strip nav a.icobtn.active svg { fill: #23330f; }
  .strip nav a.icobtn svg { width: 16px; height: 16px; }
  .strip nav a.replay {
    display: flex; align-items: center;
    font-family: "PressStart", monospace; font-size: 8px;
    background: linear-gradient(180deg, #f4f7cf, #d8dd96); color: #23330f;
    border: 3px solid var(--edge); border-radius: 7px;
    padding: 7px 8px; box-shadow: 0 3px 0 rgba(0,0,0,.35);
  }

  .stage { flex: 1; min-height: 640px; min-width: 0; }

  /* ── settings panel ─────────────────────────────────────── */
  .setpanel { height: 100%; display: flex; flex-direction: column; padding: 12px; max-width: 640px; margin: 0 auto; }
  .settop {
    font-family: "PressStart", monospace; font-size: 10px; text-shadow: var(--shadowtext);
    padding: 2px 4px 11px;
    border-bottom: 3px solid rgba(0,0,0,.28);
  }
  .setscroll { flex: 1; min-height: 0; overflow-y: scroll; overflow-x: hidden; padding: 4px 2px 2px; }
  .setscroll::-webkit-scrollbar { width: 8px; }
  .setscroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,.35); border-radius: 4px; }

  .setsection { padding: 16px 6px 20px; border-bottom: 3px solid rgba(0,0,0,.28); }
  .setsection:last-child { border-bottom: none; }
  .sethead {
    font-size: 9px; color: var(--pale); text-shadow: var(--shadowtext);
    display: flex; align-items: center; gap: 8px;
  }
  .sethead::after { content: ""; flex: 1; height: 2px; background: rgba(0,0,0,.25); }
  .sethelp { margin: 8px 2px 14px; font-size: 17px; line-height: 1.3; color: rgba(255,255,255,.65); }

  /* ── daily target ───────────────────────────────────────── */
  .targetrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .targetinput {
    width: 72px; font-family: "PressStart", monospace; font-size: 15px; text-align: center;
    background: rgba(0,0,0,.28); color: #fff; border: 2px solid rgba(255,255,255,.25);
    border-radius: 7px; padding: 9px 4px;
  }
  .targetinput::-webkit-inner-spin-button { opacity: 1; }
  .targetunit { font-size: 17px; color: var(--pale); }

  /* ── labels ─────────────────────────────────────────────── */
  .labellist { display: flex; flex-direction: column; gap: 6px; margin-bottom: 4px; }
  .labelrow {
    display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 4px; border-radius: 7px;
  }
  .labelrow:hover { background: rgba(0,0,0,.14); }
  .reorder { display: flex; flex-direction: column; }
  .arrowbtn { font-size: 10px; padding: 1px 4px; color: var(--pale); }
  .arrowbtn:hover:not(:disabled) { color: #fff; }
  .arrowbtn:disabled { opacity: .25; cursor: default; }
  .swatch {
    flex: none; width: 24px; height: 24px; padding: 0; border: 2px solid var(--edge);
    border-radius: 6px; background: none; cursor: pointer;
  }
  .swatch::-webkit-color-swatch-wrapper { padding: 2px; }
  .swatch::-webkit-color-swatch { border: none; border-radius: 3px; }
  .labelrow input.title {
    flex: 1; min-width: 0; font-size: 20px; background: none; border: none; padding: 4px 2px;
    text-shadow: var(--shadowtext);
  }
  .labelrow input.title:focus { outline: none; text-decoration: underline dotted rgba(255,255,255,.4); }
  .delbtn {
    font-family: "PressStart", monospace; font-size: 8px; color: #ffb9ae;
    padding: 7px 9px; border-radius: 6px; flex: none;
  }
  .delbtn:hover { background: rgba(224,64,48,.25); }

  .addrow { padding: 10px 4px 0; }
  .addbtn {
    width: 100%; text-align: left; padding: 10px 10px;
    font-family: "PressStart", monospace; font-size: 10px; color: var(--sel);
    border: 2px dashed rgba(242,245,200,.5); border-radius: 8px;
  }
  .addbtn:hover { background: rgba(0,0,0,.16); }
  .addeditor[hidden] { display: none; }
  .addeditorrow { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .addeditorrow input.title {
    flex: 1; min-width: 0; font-size: 20px; background: rgba(0,0,0,.22); color: #fff;
    border: 1px solid rgba(255,255,255,.25); border-radius: 6px; padding: 8px 10px;
  }
  .addeditorrow input.title::placeholder { color: rgba(242,245,200,.5); }
  .editactions { display: flex; align-items: center; gap: 8px; margin-top: 10px; margin-left: auto; width: fit-content; }
  .ghostbtn {
    font-family: "PressStart", monospace; font-size: 9px; color: var(--pale);
    padding: 8px 10px; border-radius: 7px; border: 2px solid rgba(184,232,194,.4);
  }
  .primary {
    font-family: "PressStart", monospace; font-size: 9px;
    background: linear-gradient(180deg, #f4f7cf, #d8dd96); color: #23330f;
    border: 3px solid var(--edge); border-radius: 7px; padding: 9px 14px;
    box-shadow: 0 3px 0 rgba(0,0,0,.35);
  }
  .primary:disabled { opacity: .45; cursor: not-allowed; }

  @media (max-width: 900px) {
    .app { padding: 10px; gap: 8px; }
    .strip { padding: 9px 11px; gap: 10px; align-items: flex-start; }
    .identity { flex-direction: column; align-items: flex-start; gap: 3px; }
    .identity .zone { font-size: 9px; }
    .identity .who { gap: 8px; font-size: 7px; }
    .strip .ball { margin-top: 2px; }
    .stage { min-height: 0; }
    .setpanel { padding: 10px; max-width: none; }
  }
</style>
</head>
<body>
<div class="app" id="app">

  <div class="strip">
    <span class="ball"></span>
    <div class="identity">
      <span class="zone">SAFARI ZONE</span>
      <span class="who">
        <span style="color:var(--pale)">RANGER DANTE</span>
        <span style="color:var(--pale)">DAY 119</span>
      </span>
    </div>
    <nav>
      <a class="replay" href="b-safari-gear.html">← FIELD LOG</a>
      <a class="icobtn" href="b-pokedex.html" title="Pokédex" aria-label="Pokédex"><svg viewBox="0 0 16 16" shape-rendering="crispEdges" fill="currentColor" data-icon="dex"></svg></a>
      <a class="icobtn" href="b-history.html" title="Logbook" aria-label="Logbook"><svg viewBox="0 0 16 16" shape-rendering="crispEdges" fill="currentColor" data-icon="book"></svg></a>
      <a class="icobtn active" href="b-settings.html" title="Settings" aria-label="Settings"><svg viewBox="0 0 16 16" shape-rendering="crispEdges" fill="currentColor" data-icon="gear"></svg></a>
    </nav>
  </div>

  <div class="stage">
    <div class="setpanel panel">
      <div class="settop">RANGER SETTINGS</div>
      <div class="setscroll">

        <section class="setsection">
          <div class="sethead">DAILY TARGET</div>
          <p class="sethelp">Changing this only affects future days — a day already logged keeps
             the target it was judged against at the time.</p>
          <div class="targetrow">
            <input class="targetinput" id="targetInput" type="number" min="1" step="1" value="5">
            <span class="targetunit">PTS / DAY</span>
            <button class="primary" id="targetSave">UPDATE TARGET</button>
          </div>
        </section>

        <section class="setsection">
          <div class="sethead">LABELS</div>
          <p class="sethelp">How tasks are grouped. Yours alone — no other Ranger sees or shares this list.</p>

          <div class="labellist" id="labelList">
            <div class="labelrow">
              <div class="reorder">
                <button class="arrowbtn up" aria-label="Move up" disabled>▲</button>
                <button class="arrowbtn down" aria-label="Move down">▼</button>
              </div>
              <input class="swatch" type="color" value="#2f7d4f" aria-label="RESERVE colour">
              <input class="title" type="text" value="RESERVE">
              <button class="delbtn">DELETE</button>
            </div>
            <div class="labelrow">
              <div class="reorder">
                <button class="arrowbtn up" aria-label="Move up">▲</button>
                <button class="arrowbtn down" aria-label="Move down">▼</button>
              </div>
              <input class="swatch" type="color" value="#146b62" aria-label="RESEARCH colour">
              <input class="title" type="text" value="RESEARCH">
              <button class="delbtn">DELETE</button>
            </div>
            <div class="labelrow">
              <div class="reorder">
                <button class="arrowbtn up" aria-label="Move up">▲</button>
                <button class="arrowbtn down" aria-label="Move down">▼</button>
              </div>
              <input class="swatch" type="color" value="#8a5a3b" aria-label="ADMIN colour">
              <input class="title" type="text" value="ADMIN">
              <button class="delbtn">DELETE</button>
            </div>
            <div class="labelrow">
              <div class="reorder">
                <button class="arrowbtn up" aria-label="Move up">▲</button>
                <button class="arrowbtn down" aria-label="Move down" disabled>▼</button>
              </div>
              <input class="swatch" type="color" value="#5a5a8a" aria-label="PERSONAL colour">
              <input class="title" type="text" value="PERSONAL">
              <button class="delbtn">DELETE</button>
            </div>
          </div>

          <div class="addrow" id="addRow">
            <button class="addbtn" id="addBtn">+ ADD A LABEL</button>
            <div class="addeditor" id="addEditor" hidden>
              <div class="addeditorrow">
                <input class="swatch" type="color" id="addColor" value="#146b62" aria-label="New label colour">
                <input class="title" type="text" id="addTitle" placeholder="Label name">
              </div>
              <div class="editactions">
                <button class="ghostbtn" id="addCancel">CANCEL</button>
                <button class="primary" id="addSave" disabled>SAVE</button>
              </div>
            </div>
          </div>
        </section>

      </div>
    </div>
  </div>

</div>

<script>
  const ICONS = {
    dex: [
      '................','..111111111111..','..1..........1..','..1..........1..',
      '..1...111....1..','..1..11111...1..','..1..11111...1..','..1..11111...1..',
      '..1...111....1..','..1..........1..','..1.11111111.1..','..1..1..1..1.1..',
      '..1..........1..','..111111111111..','................','................',
    ],
    book: [
      '................','................','...1111111111...','...1.1......1...',
      '...1.1......1...','...1.1.111111...','...1.1......1...','...1.1.111111...',
      '...1.1......1...','...1.1.111111...','...1.1......1...','...1.1111111...',
      '...1.1......1...','...1111111111...','................','................',
    ],
    gear: [
      '................','.......1........','.......1........','...1.111111.1...',
      '....11....11....','...11......11...','...1...11...1...','...1..1..1..1...',
      '.111..1..1..111.','...1...11...1...','...11......11...','....11....11....',
      '...1.111111.1...','........1.......','........1.......','................',
    ],
  };
  document.querySelectorAll('svg[data-icon]').forEach(svg => {
    const bitmap = ICONS[svg.dataset.icon];
    const frag = document.createDocumentFragment();
    bitmap.forEach((row, y) => {
      for (let x = 0; x < row.length; x++) {
        if (row[x] === '1') {
          const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
          r.setAttribute('x', x); r.setAttribute('y', y);
          r.setAttribute('width', 1); r.setAttribute('height', 1);
          frag.appendChild(r);
        }
      }
    });
    svg.appendChild(frag);
  });

  // ── labels: reorder / delete, mirrors the field log's live-edit model ──
  const labelList = document.getElementById('labelList');

  function refreshArrows() {
    const rows = [...labelList.querySelectorAll('.labelrow')];
    rows.forEach((row, i) => {
      row.querySelector('.up').disabled = i === 0;
      row.querySelector('.down').disabled = i === rows.length - 1;
    });
  }

  labelList.addEventListener('click', e => {
    const row = e.target.closest('.labelrow');
    if (!row) return;
    if (e.target.closest('.delbtn')) { row.remove(); refreshArrows(); return; }
    if (e.target.closest('.up')) { row.previousElementSibling?.before(row); refreshArrows(); return; }
    if (e.target.closest('.down')) { row.nextElementSibling?.after(row); refreshArrows(); return; }
  });

  // ── add a label ──────────────────────────────────────────
  const addBtn = document.getElementById('addBtn');
  const addEditor = document.getElementById('addEditor');
  const addTitle = document.getElementById('addTitle');
  const addColor = document.getElementById('addColor');
  const addSave = document.getElementById('addSave');

  function closeAddEditor() {
    addEditor.hidden = true;
    addBtn.hidden = false;
    addTitle.value = ''; addColor.value = '#146b62';
    addSave.disabled = true;
  }
  addTitle.addEventListener('input', () => { addSave.disabled = !addTitle.value.trim(); });
  addBtn.addEventListener('click', () => { addBtn.hidden = true; addEditor.hidden = false; addTitle.focus(); });
  document.getElementById('addCancel').addEventListener('click', closeAddEditor);
  addSave.addEventListener('click', () => {
    const name = addTitle.value.trim();
    if (!name) return;
    const row = document.createElement('div');
    row.className = 'labelrow';
    row.innerHTML = `
      <div class="reorder">
        <button class="arrowbtn up" aria-label="Move up">▲</button>
        <button class="arrowbtn down" aria-label="Move down" disabled>▼</button>
      </div>
      <input class="swatch" type="color" value="${addColor.value}" aria-label="${name} colour">
      <input class="title" type="text" value="${name}">
      <button class="delbtn">DELETE</button>`;
    labelList.appendChild(row);
    refreshArrows();
    closeAddEditor();
  });
  refreshArrows();

  // ── daily target: a visible confirmation, no real persistence ──
  const targetSave = document.getElementById('targetSave');
  targetSave.addEventListener('click', () => {
    const original = targetSave.textContent;
    targetSave.textContent = 'SAVED ✓';
    setTimeout(() => { targetSave.textContent = original; }, 1100);
  });
</script>
</body>
</html>
